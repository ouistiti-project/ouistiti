user="root";
#log-file="/var/log/ouistiti.log";
#log-file="/dev/null";
pid-file="/run/ouistiti/ouistiti.pid";
servers= (
	{
		hostname = "www.ouistiti.net";
		port = 8080;
		keepalivetimeout = 90;
		chunksize = 128;
		version="HTTP11";
		redirect = {
			mode = "hsts";
		};
	},
	{
		hostname = "www.ouistiti.net";
		port = 8443;
		keepalivetimeout = 90;
		chunksize = 512;
		version="HTTP11";
		unlock_groups = "www-data";
		auth = {
			unprotect = "index.html,public";
			realm = "Welcome to ouistiti";
			authz = "unix";
			type = "Basic";
			mode = "home";
		};
		filestorage = {
			docroot = "htdocs";
			deny = "^.htaccess,.php";
			defaultpage = "index.html";
		};
		websocket = {
			docroot = "websocket";
			allow = "*";
			services = "echo,chat";
		};
		tls = {
			crtfile = "conf/ouistiti_srv.crt";
			keyfile = "conf/ouistiti_srv.key";
			cachain = "conf/ouistiti_ca.crt";
			dhmfile = "conf/ouistiti_dhparam.key";
		};
	});
