<table class="table table-striped table-responsive">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
<script>
var g_cwd = undefined;
buildpath = function(path, index) {
	if (! Array.isArray(path))
		path = path.split("/");
	var url = "";
	if (index == -1)
		index = path.length - 1;
	for (let i = 0; i < index + 1; i++)
	{
		let tmp = path[i];
		if (typeof(tmp) == "string" && tmp.length > 0)
			url += tmp + "/";
	}
	return url;
}

playaudio = function(index) {
	var buttons = $("#directorylist").find(".audioplay");
	buttons.removeClass("btn-primary");
	var button;
	for (let i = 0; i < buttons.length; i++)
	{
		if ($(buttons[i]).data("index") == index)
		{
			button = buttons[i];
			break;
		}
	}
	if (button == undefined)
		return;
	$(button).addClass("btn-primary");
	var name = $(button).data("name");
	var url = $(button).data("url");
	var type = $(button).data("type");
	$("#mediaAudio").data("index", index);
	$("#mediaAudio").attr("src", url);
	$("#mediaAudio").attr("type", type);
	$("#mediaAudio")[0].play();
	$("#mediaPlayerTitle").text(name);
}

generateShareLink = function(name, type, input) {
	getRandomFileName = function() {
return [...Array(12)].map((value) => (Math.random() * 1000000).toString(36).replace('.', '')).join('');
	};
	var base = document.location.protocol+"//";
	base += document.location.host;
	var link = "/none";
	switch (type) {
		case "public":
			link = "/~/public/" + getRandomFileName();
		break;
		case "private":
			link = "/~/shared/" + getRandomFileName();
		break;
	}
	$(input).val(base+link);

}

createtool = function(entry) {
	var tools = $("<td class='navbar navbar-expand-lg' role='navigation'><div class='container-fluid'></div></td>");
	var toggler = $("<button class='navbar-toggler' type='button' data-bs-toggle='collapse' data-bs-target='#tools"+entry.index+"' aria-controls='tools"+entry.index+"' aria-expanded='false' aria-label='tools list'><span class='navbar-toggler-icon'></span></button>");
	var collapse = $("<div class='collapse navbar-collapse' id='tools"+entry.index+"'></div>");
	var toolslist = $("<nav class= 'nav'></nav>");
	collapse.append(toolslist);
	tools.find("div").append(toggler);
	tools.find("div").append(collapse);

	var url = "/" + entry.filepath;
	var downloadtool = $("<a role='button' class='btn' href='"+url+"' download='"+entry.name+"'><span class='glyphicon glyphicon-download' aria-hidden='true'></span></a>");
	toolslist.append(downloadtool);

	var sharetool = $("<a role='button' class='btn' href='#' ><span class='glyphicon glyphicon-share' aria-hidden='true'></span></a>");
	sharetool.data('src', url);
	sharetool.data('name', entry.name);
	sharetool.on("click", function(event) {
		var url = $(this).data("src");
		$("#shareSource").val(url);
		var name = $(this).data("name");
		generateShareLink(name, "public", $("#shareLink"));
		$("#shareModal").modal("show");
	});
	toolslist.append(sharetool);

	var deletetool = $("<a role='button' class='btn deletetool' href='#'><span class='glyphicon glyphicon-trash' aria-hidden='true'></span></a>");
	deletetool.data("url", url);
	deletetool.on("click", function(event) {
		var url = $(this).data("url");
		$("#deleteInput").val(url);
		$("#deleteModal").modal("show");
	});
	toolslist.append(deletetool);
	if (entry.mime.startsWith("image/"))
	{
		var screentool = $("<a role='button' class='btn ms-auto fullscreen' aria-label='show'><span class='glyphicon glyphicon-fullscreen' aria-hidden='true'></span></a>");
		screentool.data("index", entry.index);
		screentool.data("url", url);
		screentool.on("click", function(event){
			var viewer = $("#imageViewer");
			var image = viewer.find("img");
			image.prop("src", $(this).data("url"));
			viewer.modal("show");
		});
		toolslist.append(screentool);
	}
	if (entry.mime.startsWith("audio/"))
	{
		var playtool = $("<a role='button' class='btn ms-auto audioplay' aria-label='play'><span class='glyphicon glyphicon-play' aria-hidden='true'></span></a>");
		playtool.data("index", entry.index);
		playtool.data("url", url);
		playtool.data("name", entry.name);
		playtool.data("type", entry.type);
		playtool.on("click", function(event) {
			$("#mediaPlayer").modal("show");
			playaudio($(this).data("index"));
		});
		toolslist.append(playtool);
	}
	return tools;
}

filltable = function(entry) {
	var index = $("#directorylist").children("tr").length;
	var dirindex = $("#directorylist").data("index");
	var tr = $("<tr><th class='d-xs-none' scope='row'>"+index+"</th></tr>");
	tr.data("index", index);
	entry.index = index;
	var name = entry.name;
	var tool = $("<td></td>");
	entry.filepath = encodeURI(buildpath(g_cwd, dirindex) + entry.name);
	if (entry.mime == "inode/directory")
	{
		entry.filepath += "/";
		var base = document.location.protocol+"//";
		base += document.location.host;
		base += document.location.pathname;
		name = "<a href='"+base+"?cwd="+entry.filepath+"'>"+entry.name+"</a>";
	}
	else
		tool = createtool(entry);
	tr.append($("<td>"+name+"</td>"));
	tr.append(tool);
	tr.append($("<td class='d-xs-none'>"+entry.size+"</td>"));
	tr.append($("<td class='d-xs-none'>"+entry.mime+"</td>"));
	$("#directorylist").append(tr);
}
loaddir = function(path, index) {
	var url = "/" + buildpath(path, index);
	$.ajax({
		method: "GET",
		url: url,
		headers: {
			"X-Requested-With": "XMLHttpRequest",
		},
		cache: false,
		async: true,
		timeout: 60000,
	}).done(function(data) {
		if (data.content == undefined)
		{
			console.log("dirlisting returns corrupted data");
			return;
		}
		$("#directorylist").empty();
		$("#directorylist").data("index", index);
		let contents = data.content.sort((a,b) => {
			if (a.type < b.type)
				return -1;
			if (a.name < b.name)
				return -1;
			return 1;
		});
		for (let entry of contents)
		{
			if (entry.name != undefined)
				filltable(entry);
		}
		if (!$("#mediaPlayer")[0].paused)
		{
			var audiobuttons = $("#directorylist").find(".audioplay");
			var playingurl = $("#mediaPlayer").attr("src");
			for (let entry in audiobuttons)
			{
				if ($(entry).data("url") == playingurl)
					$(entry).addClass("btn-primary");
			}
		}
	}).fail(function(data) {
		if (data.text != undefined)
			console.log(data.text);
		else
			console.log("error");
	});
}
changepath = function(path) {
	var path = path.split("/");
	var $breadcrumb = undefined;
	var id = 1;
	for (let item of path)
	{
		if (item && item[0] != '~')
		{
			$breadcrumb = $("<li class='breadcrumb-item'><a href='#' data-index='"+id+"' class='dir'>"+item+"</a></li>");
			$("#cwd").append($breadcrumb);
			id++;
		}
	}
	$("#cwd").removeClass("active");
	$("#cwd").data("path", path);
	if ($breadcrumb)
		$breadcrumb.addClass("active");
	$(".dir").on("click", function(elem){
		loaddir($("#cwd").data("path"), $(this).data("index"));
	});
}
updelete = function(url) {
	return fetch(url, {
		method: "DELETE",
		headers: {
			"X-Requested-With": "XMLHttpRequest",
		},
	});
}
upload = function(file, path, index) {
	var url = "/" + buildpath(path, index);
	var body = undefined;
	if ( file.size != undefined)
		body = file;
	return fetch(url+file.name, {
		method: "PUT",
		headers: {
			"Content-Type": file.type,
			"X-Requested-With": "XMLHttpRequest",
		},
		body: body,
	});
}
uplink = function(url, source) {
	return fetch(url, {
		method: "PUT",
		headers: {
			"Content-Type": "inode/symlink",
			"Location": source,
			"X-Requested-With": "XMLHttpRequest",
		},
	});
}
$(document).ready(function(){
	var searchs = window.location.search.substring(1).split("&");
	const isCWD = (elem) => elem.startsWith("cwd=");
	var cwd = searchs.find(isCWD);
	if (cwd)
		g_cwd = decodeURI(cwd.split("=")[1]);
	else
		g_cwd = "~/";
	//if (g_cwd[0] != '~')
	//	g_cwd = "~/" + g_cwd;
	changepath(g_cwd);
	loaddir(g_cwd, -1);

	$("#progressModal").on('hidden.bs.modal', function () {
		//$(".modal-backdrop").remove();
		$("#progressModal").modal("hide");
		var index = $("#directorylist").data("index");
		loaddir(g_cwd, index);
	});
	$("#uploadModal").on('hidden.bs.modal', function () {
		if ($(this).data("action") != "create")
			return;
		$(this).data("action", "");
		var files = $("#fileInput")[0].files;
		$("#progressModal").find(".spinner-border").removeClass("invisible");
		var progress = $("#progressModal");
		$(progress).find(".status").text("uploading");
		var items = $(progress).data("items");
		if (items == undefined)
			items = 0;
		items += files.length;
		$(progress).data("items",items);
		var checkprogress = setInterval(function() {
			var progress = $("#progressModal");
			var items = $(progress).data("items");
			if (items == 0)
			{
				clearInterval(checkprogress);
				var status = $(progress).data("status");
				$(progress).find(".status").text(status);
				$("#progressModal").find(".spinner-border").addClass("invisible");
			}
		}, 200);
		$("#uploadModal").modal("hide");
		for (id in files)
		{
			if (files[id].type == undefined)
				continue;
			var index = $("#directorylist").data("index");
			upload(files[id], g_cwd, index).then((data) => {
				var progress = $("#progressModal");
				var items = $(progress).data("items");
				items--;
				$(progress).data("items", items);
				$(progress).data("status", files.length+" items uploaded");
			},(data)=> {
				var progress = $("#progressModal");
				$(progress).data("items", 0);
				$(progress).data("status", "failed");
			});
		}
	});

	$("#uploadButton").on("click", function(event) {
		$("#uploadModal").data("action", "create");
	});
	$("#newDirButton").on("click", function(event) {
		$("#newDirModal").modal('hide');
		var newDir = {}
		newDir.name = $("#newDirInput").val();
		newDir.type = "inode/directory";
		var index = $("#directorylist").data("index");
		upload(newDir, g_cwd, index).then((data) => {
			loaddir(g_cwd, index);
		});
	});
	$("#mediaAudio").on("ended", function(event) {
		var index = $(this).data("index") + 1;
		if ($("#checkrandom").is(":checked"))
		{
			var buttons = $("#directorylist").find(".audioplay");
			var maxaudio = buttons.length;
			index = Math.floor(Math.random() * maxaudio);
		}
		playaudio(index);
	});
	$("#deleteButton").on("click", function(event) {
		var url = $("#deleteInput").val();
		updelete(url).then((data) => {
			loaddir(g_cwd, $("#directorylist").data("index"));
		});
		$("#deleteModal").modal("hide");
	});
	$("#copyShareLink").on("click", function(event) {
		$("#shareLink").select();
		document.execCommand("copy");
	});
	$("#shareButton").on("click", function(event) {
		var url = $("#shareLink").val();
		var src = $("#shareSource").val();
		uplink(url, src).then((data) => {
			loaddir(g_cwd, $("#directorylist").data("index"));
		});
		$("#shareModal").modal("hide");
	});
});
</script>
</body>
